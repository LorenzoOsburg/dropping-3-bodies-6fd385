project:
  name: "Dropping Three Bodies"
  description: >-
    Lean formalization of contraction for three planar bodies released
    from rest under symmetric attractive central forces, and of the
    first collision-free syzygy and strict side-order preservation for
    equal positive masses with a common inverse-power potential of
    exponent 0 < α < 2.

  # Include all substantive human contributors to the formalization.
  authors:
    - "Manuel Quaschner"
    - "Lorenz Osburg"

  # People responsible for maintaining the submitted repository.
  responsible_maintainers:
