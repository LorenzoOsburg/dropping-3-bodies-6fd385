fidelity:
  divergences: >-
    
divergences: >-
    The two advertised main theorems agree with their
    mathematical statements in the manuscript, subject
    to the documented normalization and indexing
    conventions.

    The manuscript additionally presents an explicit
    angle-based upper bound for the first syzygy time
    for general subcritical power-law potentials.
    The Lean development proves an analogous explicit
    angle-time bound for Newtonian gravity, while
    finiteness for general positive attractive powers
    follows from the Jacobi/Riccati area argument.

    Some intermediate results use equivalent formulations
    or different normalizations. These differences do
    not weaken the advertised main theorems.

    In fact for Q2 the Lean development proves a more general statement
    of \alpha ≤ 2, while the manuscript restricts to \alpha < 2.

review:
  status: "self-assessed"

  reviewers:
