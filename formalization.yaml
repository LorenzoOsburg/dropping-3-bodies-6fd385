status:
  scope: >-
    
    The formalization proves two main results for planar
    three-body brake orbits. First, for arbitrary positive
    masses and symmetric, strictly attractive C1 central
    pair forces, it establishes strict contraction of the
    centered spatial second-moment tensor, strict decrease
    of the scalar mass moment and oriented area, and
    finiteness of the initial noncollinear branch.
    The mass-moment derivative is also negative at a
    regular first syzygy.

    Second, for equal positive masses, scalene initial
    configurations, and homogeneous power-law potentials
    with 0 < alpha < 2, it proves the existence of a finite
    first regular syzygy, collision exclusion, strict
    preservation of side ordering, and identification
    of the middle body.

    The internal Lean development additionally formalizes
    the torque equation, division-free kinematic identity,
    side-comparison mechanism, quantitative energy-based
    collision barrier, and endpoint continuation argument.

    The manuscript's explicit general-power angle-time
    bound is not separately formalized; an analogous
    quantitative bound is proved for Newtonian gravity.


  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

