  notes: >-
    
review:
  notes: >-
    Human-guided review included examination of the mathematical
    definitions, theorem statements, assumptions, and their
    correspondence with the research manuscript. The upstream
    development also records a partial human-guided walkthrough
    of selected statements and definitions.

    Agent-assisted reviews checked theorem contracts and source
    consistency. Lean builds and transitive axiom audits were
    performed. An upstream review dated 5 November 2026 at
    revision 32864f4 reported 1,318 public declarations relying
    only on propext, Classical.choice, and Quot.sound.

    The submitted Principia development was additionally checked
    by exact statement-type comparison and the official
    sandboxed comparator, including Lean kernel, NanoDa, and
    con-ron acceptance. See VERIFICATION.md and its logs.

    Human mathematical review was internal and is not presented
    as an independent external peer review. A complete manual
    line-by-line examination of every Lean proof is not claimed.

    Several supplementary notes document a targeted human-guided
    comparison of selected Lean statements.



alignment:
  namespace: PrincipiaThreeBodies

  statements:
    - source: 'dropping_three_bodies.tex, label thm:inertia'
      lean: PrincipiaThreeBodies.centerOfMassMomentCurve_strictAntiOn_initialBranch
      module: Solution
      status: proved
      note: >-
        Representative Q1 theorem. The complete ten-declaration
        Q1 inventory and its precise hypotheses are documented
        in STATEMENTS.md.

    - source: 'dropping_three_bodies.tex, label thm:ordering'
      lean: PrincipiaThreeBodies.power_q2_subcritical
      module: Solution
      status: proved
      note: >-
        The advertised theorem assumes alpha < 2 and invokes
        the underlying theorem valid for alpha <= 2.

